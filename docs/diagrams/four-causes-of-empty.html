<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four Causes of Empty</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
    --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace;
  }
  body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
             text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
       letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart &middot; TVI-CAMS</p>
  <h1>Four reasons a screen shows zero batches &mdash; and only one is honest today</h1>

  <svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fourcauses-title fourcauses-desc">
    <title id="fourcauses-title">Four reasons a screen shows zero batches</title>
    <desc id="fourcauses-desc">A decision flow from "screen shows 0 batches" through three checks - valid token, active profile, tenant membership - producing four distinct causes. Each outcome lists the snapshot state it should return against the state the app actually returns today, showing that only the genuinely-empty case is currently reported truthfully.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ARROWS -->
    <line x1="620" y1="88" x2="620" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="524" y1="168" x2="372" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="150" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="448" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <line x1="620" y1="212" x2="620" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="626" y="234" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="630" y="243" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

    <line x1="524" y1="312" x2="372" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="294" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="448" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <line x1="620" y1="356" x2="620" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="626" y="378" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="630" y="387" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

    <line x1="524" y1="456" x2="372" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="438" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="448" y="447" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <line x1="620" y1="500" x2="620" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="626" y="536" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="630" y="545" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

    <!-- START OVAL -->
    <rect x="520" y="40" width="200" height="48" rx="20" fill="#f5f5f5"/>
    <rect x="520" y="40" width="200" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="620" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen shows 0 batches</text>
    <text x="620" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what actually happened?</text>

    <!-- D1 -->
    <polygon points="620,124 716,168 620,212 524,168" fill="#f5f5f5"/>
    <polygon points="620,124 716,168 620,212 524,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="620" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Valid token</text>
    <text x="620" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">reached Postgres?</text>

    <!-- D2 -->
    <polygon points="620,268 716,312 620,356 524,312" fill="#f5f5f5"/>
    <polygon points="620,268 716,312 620,356 524,312" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="620" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Active profile</text>
    <text x="620" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">matches sub?</text>

    <!-- D3 (FOCAL) -->
    <polygon points="620,412 716,456 620,500 524,456" fill="#f5f5f5"/>
    <polygon points="620,412 716,456 620,500 524,456" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="620" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenant</text>
    <text x="620" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">membership?</text>

    <!-- OUTCOME A -->
    <rect x="92" y="136" width="280" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="92" y="136" width="280" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="108" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Auth chain broken</text>
    <text x="108" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SHOULD &nbsp;sync-failed</text>
    <text x="108" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TODAY &nbsp;&nbsp;mocks, or ok + empty</text>

    <!-- OUTCOME B -->
    <rect x="92" y="280" width="280" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="92" y="280" width="280" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="108" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">No active profile row</text>
    <text x="108" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SHOULD &nbsp;sync-failed</text>
    <text x="108" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TODAY &nbsp;&nbsp;ok + empty</text>

    <!-- OUTCOME C (FOCAL) -->
    <rect x="92" y="424" width="280" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="92" y="424" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="108" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">No tenant membership</text>
    <text x="108" y="464" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">SHOULD &nbsp;no-tenant-access</text>
    <text x="108" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TODAY &nbsp;&nbsp;ok + empty</text>

    <!-- TERMINAL D -->
    <rect x="480" y="584" width="280" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="480" y="584" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="496" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Genuinely zero batches</text>
    <text x="496" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SHOULD &nbsp;ok + empty</text>
    <text x="496" y="638" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TODAY &nbsp;&nbsp;ok + empty</text>
    <text x="784" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">THE ONLY HONEST ROW</text>

    <!-- editorial aside -->
    <text x="92" y="600" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The membership check is not</text>
    <text x="92" y="620" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">asked at all today &mdash; which is</text>
    <text x="92" y="640" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">why three rows collapse into one.</text>

    <!-- LEGEND -->
    <line x1="30" y1="708" x2="970" y2="708" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="30" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="716" width="16" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="144" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START</text>
    <polygon points="268,712 280,721 268,730 256,721" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="290" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CHECK</text>
    <rect x="400" y="716" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="424" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MISREPORTED CAUSE</text>
    <rect x="628" y="716" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="652" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NEEDS A NEW STATE</text>
  </svg>
</div>
</body>
</html>

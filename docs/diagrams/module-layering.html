<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVI-CAMS — Module Layering</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,0.12);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;padding:3rem 2rem;}
  .wrap{max-width:960px;margin:0 auto}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.75rem;margin:0 0 .5rem}
  .sub{color:var(--muted);font-size:13px;margin:0 0 2rem;max-width:60ch}
  svg{width:100%;height:auto;display:block}
  footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">TVI-CAMS / Architecture</p>
<h1>Module layering</h1>
<p class="sub">Four levels, one legal import direction, enforced by ESLint. The rule that actually bites: another module's <code>data/</code> is private.</p>

<svg viewBox="0 0 880 640" role="img" aria-labelledby="modlayer-title modlayer-desc">
<title id="modlayer-title">TVI-CAMS module layering and import direction</title>
<desc id="modlayer-desc">Four stacked levels — app routes, domain modules, shared leaf code, and the Supabase data boundary — where imports may only travel downward. Within a module, the data layer is private to that module; other modules may import its domain and ui layers but never its data layer.</desc>

<defs>
  <marker id="ml-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>

<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- import direction arrow (right rail), drawn before boxes -->
<line x1="792" y1="112" x2="792" y2="504" stroke="#eb6c36" stroke-width="1" marker-end="url(#ml-arrow-accent)"/>
<rect x="712" y="84" width="160" height="12" rx="2" fill="#f5f5f5"/>
<text x="792" y="93" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">IMPORTS MAY ONLY GO DOWN</text>

<!-- L1 app/ -->
<rect x="48" y="112" width="640" height="80" rx="6" fill="#f5f5f5"/>
<rect x="48" y="112" width="640" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<rect x="60" y="122" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="76" y="131" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">L1</text>
<text x="112" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">app/ — thin routes</text>
<text x="112" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Server Components: fetch + compose. No business logic.</text>

<!-- L2 modules/ -->
<rect x="48" y="216" width="640" height="80" rx="6" fill="#f5f5f5"/>
<rect x="48" y="216" width="640" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="60" y="226" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="76" y="235" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">L2</text>
<text x="112" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">modules/&lt;domain&gt;/{data,domain,ui}</text>
<text x="112" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">14 modules, one per PRD requirement. 7 have a data/ layer today.</text>

<!-- L3 shared/ -->
<rect x="48" y="320" width="640" height="80" rx="6" fill="#f5f5f5"/>
<rect x="48" y="320" width="640" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="60" y="330" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="76" y="339" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">L3</text>
<text x="112" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">shared/ — leaf level</text>
<text x="112" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">ui/ primitives, types.ts, mocks/. Must never import modules/ or app/.</text>

<!-- L4 lib/supabase -->
<rect x="48" y="424" width="640" height="80" rx="6" fill="#f5f5f5"/>
<rect x="48" y="424" width="640" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<rect x="60" y="434" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
<text x="76" y="443" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">L4</text>
<text x="112" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">lib/supabase/ — external data boundary</text>
<text x="112" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">database.types.ts importable ONLY from a module data/ layer.</text>

<!-- privacy callout — FOCAL -->
<rect x="48" y="528" width="640" height="48" rx="6" fill="#f5f5f5"/>
<rect x="48" y="528" width="640" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="60" y="536" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
<text x="90" y="545" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">THE RULE</text>
<text x="136" y="558" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Another module's data/ is private</text>
<text x="136" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Import its domain/ or ui/ instead. Only app/ may call any module's data/.</text>

<!-- legend -->
<line x1="32" y1="600" x2="848" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">LEGEND</text>
<rect x="120" y="610" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="144" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">LINT-ENFORCED CONSTRAINT</text>
<rect x="376" y="610" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="400" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">DOMAIN CODE</text>
<rect x="560" y="610" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="584" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EXTERNAL BOUNDARY</text>
</svg>

<footer>TVI-CAMS · verified against eslint.config.mjs import/no-restricted-paths and modules/ tree · 2026-09-01</footer>
</div>
</body>
</html>

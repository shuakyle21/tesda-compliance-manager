<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenant Isolation Enforcement</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-accent: #eb6c36;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--color-muted); margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Secure paved road</p>
  <h1>Where tenant isolation is enforced — and where it quietly isn't</h1>

  <svg viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tenant-iso-title tenant-iso-desc">
    <title id="tenant-iso-title">Tenant isolation enforcement and its fallback bypass</title>
    <desc id="tenant-iso-desc">A Clerk session resolves to a tenant membership, which Postgres row-level security uses to scope the batches table so the demo account sees one batch and is denied the other four. A parallel path shows that when the data layer snapshot is not ok, the app serves unscoped mock batches to the same dashboard, so the isolation assertion passes visually while proving nothing.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ ZONES (drawn first) ============ -->
    <rect x="32" y="160" width="168" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="36" y="164" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="40" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IDENTITY</text>

    <rect x="224" y="160" width="608" height="200" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="228" y="164" width="216" height="12" rx="2" fill="#f5f5f5"/>
    <text x="232" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">POSTGRES — RLS IS THE BOUNDARY</text>

    <rect x="856" y="160" width="232" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="860" y="164" width="132" height="12" rx="2" fill="#f5f5f5"/>
    <text x="864" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NEXT.JS RUNTIME</text>

    <!-- ============ CONNECTORS (before boxes) ============ -->
    <!-- C1 clerk -> memberships -->
    <line x1="176" y1="228" x2="240" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="186" y="208" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="212" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JWT SUB</text>

    <!-- C2 memberships -> gate (unlabeled; layout carries it) -->
    <line x1="416" y1="228" x2="456" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C3 gate -> batches : the paved road -->
    <line x1="624" y1="228" x2="664" y2="228" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="628" y="208" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="648" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

    <!-- C4 batches -> data layer -->
    <line x1="808" y1="228" x2="872" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="820" y="208" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="844" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 OF 5</text>

    <!-- C5 forbidden ingress: terminates at a stop bar, never enters -->
    <path d="M 544,264 V 304" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="524" y1="306" x2="564" y2="306" stroke="#eb6c36" stroke-width="2"/>
    <rect x="480" y="316" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="544" y="325" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENY · J3ED · NEN</text>

    <!-- C6 data layer -> mock (bypass begins) -->
    <path d="M 992,264 V 336" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="1000" y="294" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="1028" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT OK</text>

    <!-- C7 data layer -> governed outcome -->
    <path d="M 896,264 V 448 Q 896,456 888,456 H 788 Q 780,456 780,464 V 488" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="848" y="334" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="866" y="343" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

    <!-- C8 mock -> void outcome -->
    <path d="M 992,416 V 488" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="1000" y="444" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="1032" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNSCOPED</text>

    <!-- ============ NODES ============ -->
    <!-- A1 Clerk session -->
    <rect x="56" y="192" width="120" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="56" y="192" width="120" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="64" y="200" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
    <text x="80" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
    <text x="116" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clerk session</text>
    <text x="116" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sub · role viewer</text>

    <!-- A2 memberships -->
    <rect x="248" y="192" width="168" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="248" y="192" width="168" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="256" y="200" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
    <text x="274" y="209" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
    <text x="332" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tenant memberships</text>
    <text x="332" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">demo → AKB · 1 row</text>

    <!-- A3 RLS gate — FOCAL 1 -->
    <rect x="456" y="192" width="168" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="192" width="168" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="464" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="478" y="209" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RLS</text>
    <text x="540" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">can_access_tenant</text>
    <text x="540" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app_private · per row</text>

    <!-- A4 batches -->
    <rect x="664" y="192" width="144" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="664" y="192" width="144" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="672" y="200" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
    <text x="690" y="209" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
    <text x="736" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">batches</text>
    <text x="736" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 rows · 3 tenants</text>

    <!-- A5 data layer -->
    <rect x="872" y="192" width="192" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="872" y="192" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="880" y="200" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="896" y="209" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="968" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">batches snapshot</text>
    <text x="968" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">modules/batches/data</text>

    <!-- A6 MOCK_BATCHES -->
    <rect x="920" y="344" width="144" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="920" y="344" width="144" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="928" y="352" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="944" y="361" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOCK</text>
    <text x="992" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MOCK_BATCHES</text>
    <text x="992" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared/mocks</text>

    <!-- OUT-VALID -->
    <rect x="680" y="496" width="200" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="680" y="496" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="688" y="504" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="706" y="513" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID</text>
    <text x="780" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/dashboard · 1 batch</text>
    <text x="780" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DEV-AKB-001 · proves it</text>

    <!-- OUT-VOID — FOCAL 2 -->
    <rect x="912" y="496" width="176" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="912" y="496" width="176" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="920" y="504" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="936" y="513" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOID</text>
    <text x="1000" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/dashboard · 5 batches</text>
    <text x="1000" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proves nothing</text>

    <!-- ============ EDITORIAL ASIDE ============ -->
    <text x="40" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Both paths render the same screen. Only the left one</text>
    <text x="40" y="536" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">is evidence of tenant isolation.</text>
    <text x="40" y="560" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">The “Data as of” stamp is the only visible tell.</text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="596" x2="1080" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="128" y1="612" x2="156" y2="612" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="164" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">RLS-governed path</text>

    <line x1="300" y1="612" x2="328" y2="612" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="336" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Fallback — RLS never consulted</text>

    <line x1="576" y1="612" x2="596" y2="612" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="598" y1="606" x2="598" y2="618" stroke="#eb6c36" stroke-width="2"/>
    <text x="608" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Denied at the boundary</text>

    <rect x="784" y="606" width="20" height="12" rx="3" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
    <text x="812" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Assertion-critical</text>

    <text x="944" y="616" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">2 orphan profiles omitted</text>
  </svg>
</div>
</body>
</html>

  <div class="frame">
    <p class="eyebrow">Architecture · TVI-CAMS</p>
    <h1>Multitenancy backend chain — overview</h1>
    <p class="sub">How a dashboard request resolves tenant-scoped authorization end to end. Every node names its file origin. Detail on the seven <code>app_private.*</code> RLS helper functions lives in the companion dependency diagram.</p>

      <text x="300" y="565" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUPABASE POSTGRES · RLS BOUNDARY</text>

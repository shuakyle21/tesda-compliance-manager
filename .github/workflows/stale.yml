# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

# DISABLED: this repo's issues are two-way synced with the Linear team TESDA-CAMS.
# Auto-closing a GitHub issue propagated to Linear as status "Done", marking
# unbuilt work complete (TES-50/51/53/54/55/56 were closed this way on
# 2026-07-24 with no corresponding code). The daily schedule is removed and
# both close windows are set to -1 so no run can ever close an issue or PR.
# Re-enabling requires excluding Linear-synced issues first.
on:
  workflow_dispatch:

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
        # Configuration for issues
        days-before-issue-stale: 30
        # -1 disables closing entirely; a manual run can label but never close.
        days-before-issue-close: -1
        stale-issue-message: |
          @shuakyle21 This issue has been inactive for 30 days. It will NOT be closed automatically — please review and update it if it is still relevant.
        close-issue-message: |
          @shuakyle21 This issue was closed due to inactivity. If you believe this issue is still relevant, feel free to reopen it or create a new one with updated information.
        stale-issue-label: 'no-issue-activity'
        
        # Configuration for pull requests
        days-before-pr-stale: 14
        # -1 disables closing entirely; long-lived feature branches (e.g. #85)
        # must not be auto-closed while awaiting review.
        days-before-pr-close: -1
        stale-pr-message: |
          @shuakyle21 This pull request has been inactive for 14 days. It will NOT be closed automatically — please review and update it if it is still relevant.
        close-pr-message: |
          @shuakyle21 This pull request was closed due to inactivity. If you'd like to continue with this work, please reopen it or create a new PR with your latest changes.
        stale-pr-label: 'no-pr-activity'
        
        # Don't mark issues/PRs with these labels as stale
        exempt-issue-labels: 'pinned,blocked,help-wanted'
        exempt-pr-labels: 'pinned,blocked,wip'
        
        # Mark as stale even if there are discussions
        ignore-updates: false
        
        # Operations per run (to avoid rate limiting)
        operations-per-run: 30
